<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //1. Create an array with five numbers and use array destructuring to store the first two numbers in separate variables.
        let arr=[1,2,3,4,5];
       let [first,second]=arr;
       console.log(first + " "+ second);

       //2. Create an array of colors and use the rest operator to store the remaining colors in another array.
        let colors=["orange","green","blue","Red"];
        let [firstcolor,...remaining]=colors;
        console.log(firstcolor+" "+ remaining);

      //3. Create an object with properties `name`, `age`, and `city`. Use object destructuring to extract all values.

      let student={
        name:"udhaya",
        age:23,
        city:"madurai"
          };
        let {name,age,city}=student;
        console.log(name+" "+ age+" "+city);

    //4. Create an object containing student details and rename the `name` property to `studentName` using destructuring.
        let studentDetails={
            name1:"John",
            s_age:22,
            s_city:"Chennai"
        };
        let{name1:StudentName,s_age,s_city}=studentDetails;
        console.log(StudentName +" "+s_age+" "+s_city);

    //5. Create two arrays and merge them into a single array using the spread operator.

    let arr1=[1,2,3];
    let arr2=[4,5,6];
    let merge=[...arr1,...arr2];
    console.log(merge);

    //6. Create an array and add two new elements at the beginning and end using the spread operator.
    let array=[1,2,3];
    let add=[0,...array,4];
    console.log(add);

    //7. Create an object with `name` and `age`, then create a new object by adding a `city` property using the spread operator
    let details={
        name:"joe",
        age:21
    };
    let addobj={
        ...details,
        city:"Madurai"
    };
    console.log(addobj);

    //8. Create a function that accepts any number of arguments and returns their sum using the rest operator
    function sum(...numbers)
    {
        let sumValue=0;
        for(let i of numbers)
    {
        sumValue=sumValue+i;
    }
      return sumValue;
    }
    console.log(sum(2,3));

    //9. Create a function that accepts a name as the first argument and stores all remaining arguments in an array using the rest operator.
    function fun(name,...remaining)
    {
        console.log(name);
        console.log(remaining);
    }
    fun("Bob",22,"Chennai");

    //10. Create an array with six numbers. Use destructuring with the rest operator to store the first element in one variable and the remaining elements in another array.
    let numbers = [10, 20, 30, 40, 50, 60];
    let [beginning, ...remainingnumbers] = numbers;
    console.log(beginning);
    console.log( remainingnumbers);
    </script>
