    //3. Create a `Rectangle` class with properties `length` and `width`. Add a method to calculate the area of the rectangle.

    class Rectangle {
    constructor(length, width) {
        this.length = length;
        this.width = width;
    }

    Area() {
        return this.length * this.width;
    }
}
let rectangle = new Rectangle(10, 5);
console.log( rectangle.length);
console.log( rectangle.width);
console.log( rectangle.Area());

//4. Create a `Circle` class with a property `radius`. Add a method to calculate the circumference of the circle.
class Circle {
    constructor(radius) {
        this.radius = radius;
    }

    Circumference() {
        return 2 * Math.PI * this.radius;
    }
}
let circle = new Circle(7);
console.log(circle.radius);
console.log(circle.Circumference());

//5. Create a `BankAccount` class with properties `accountNumber` and `balance`. Add methods for deposit and withdrawal.
class BankAccount {
    constructor(accountNumber, balance) {
        this.accountNumber = accountNumber;
        this.balance = balance;
    }

    deposit(amount) {
        this.balance += amount;
        console.log("Deposited:", amount);
        console.log("Balance:", this.balance);
    }

    withdrawal(amount) {
        if (amount <= this.balance) {
            this.balance -= amount;
            console.log("Withdrawn:", amount);
            console.log("Balance:", this.balance);
        } else {
            console.log("Insufficient balance");
        }
    }
}

let account = new BankAccount("123456789", 5000);
console.log("Account Number:", account.accountNumber);
console.log("Initial Balance:", account.balance);
account.deposit(2000);
account.withdrawal(1500);
account.withdrawal(10000);

    </script>
