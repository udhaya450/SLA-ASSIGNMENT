// //10.Separate even and odd numbers into two arrays.

let n = parseInt(prompt("Enter size of array"));
let arr = [];

for (let i = 0; i < n; i++) {
    arr[i] = parseInt(prompt("Enter value"));
}

let even = [];
let odd = [];

for (let i = 0; i < n; i++) {
    if (arr[i] % 2 === 0) {
        even.push(arr[i]);
    } else {
        odd.push(arr[i]);
    }
}

console.log("Original Array:", arr);
console.log("Even Array:", even);
console.log("Odd Array:", odd);
