//10. Create a `Calculator` class with methods for addition, subtraction, multiplication, and division. Create an object and perform all operations.

class Calculator {

addition(a, b) {
    return a + b;
}

subtraction(a, b) {
    return a - b;
}

multiplication(a, b) {
    return a * b;
}

division(a, b) {
    return a / b;
}
}

let calculator = new Calculator();
